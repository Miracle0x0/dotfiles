set -g @tpm-clean 'u'

# List of plugins

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# set -g @plugin "arcticicestudio/nord-tmux"

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# set -g @plugin 'dracula/tmux'
# set -g @dracula-show-fahrenheit false
# set -g @dracula-show-location false
# set -g @dracula-show-ssh-only-when-connected true
#
# set -g @dracula-clients-minimum 1

set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

set -g @plugin 'wfxr/tmux-power'
set -g @tmux_power_theme 'snow'
set -g @plugin 'wfxr/tmux-net-speed'
set -g @tmux_power_show_upload_speed   true
set -g @tmux_power_show_download_speed true
set -g @tmux_power_left_c  '󰕒 #{upload_speed}'
set -g @tmux_power_right_x '󰇚 #{download_speed}'
set -g @tmux_power_prefix_highlight_pos 'LR'

set -g @plugin 'tmux-plugins/tmux-yank'

set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'jaclu/tmux-jump'

set -g @plugin 'laktak/extrakto'

set -s set-clipboard on

set -g mouse on

setw -g mode-keys vi

set -s extended-keys always
set -as terminal-features 'xterm*:extkeys'

# 3.6 New Features
set -g pane-scrollbars on
# set -g pane-scrollbars-style

# 只在复制模式显示滚动条(推荐)
set -g pane-scrollbars modal
set -g pane-scrollbars-position right

# 自定义样式:前景色是滑块颜色,背景色是滚动条底色
set -g pane-scrollbars-style fg=colour248,bg=colour236

# For image preview
# set -g visual-activity off
set -gq allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Self-defined key bindings
bind s setw synchronize-panes

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L
bind -r J resize-pane -D
bind -r K resize-pane -U
bind -r L resize-pane -R

set -g @plugin 'christoomey/vim-tmux-navigator'

# -- windows & pane creation ---------------------------------------------------

# new window retains current path, possible values are:
#   - true
#   - false (default)
#   - disabled (do not modify new-window bindings)
tmux_conf_new_window_retain_current_path=true

# new window tries to reconnect ssh sessions, possible values are:
#   - true
#   - false (default)
#   - disabled (do not modify new-window bindings)
tmux_conf_new_window_reconnect_ssh=false

# new pane retains current path, possible values are:
#   - true (default)
#   - false
#   - disabled (do not modify split-window bindings)
tmux_conf_new_pane_retain_current_path=true

# new pane tries to reconnect ssh sessions, possible values are:
#   - true
#   - false (default)
#   - disabled (do not modify split-window bindings)
tmux_conf_new_pane_reconnect_ssh=false

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

